# .github/workflows/deploy.yml
name: Deploy Plumber API to VM

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2' # Or your desired R version

      - name: Install system dependencies for R packages (on runner)
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages:
            any::renv.lock

      - name: Cache renv packages
        uses: actions/cache@v3
        with:
          path: ~/.local/share/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Restore dependencies (on runner)
        run: R -e "renv::restore()"

      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # --- VM Setup Script ---
            # This script will run on your VM to deploy the application.
            # It assumes an Ubuntu/Debian-based OS.
            
            # Navigate to your project directory on the VM
            # Make sure this path exists on your VM
            cd /path/to/your/project || exit 1
            
            # Update package lists
            sudo apt-get update -y
            
            # Install R if not present
            if ! command -v R &> /dev/null
            then
                echo "R could not be found, installing..."
                sudo apt-get install -y --no-install-recommends software-properties-common dirmngr
                wget -qO- https://cloud.r-project.org/bin/linux/ubuntu/marutter_pubkey.asc | sudo tee -a /etc/apt/trusted.gpg.d/cran_ubuntu_key.asc
                sudo add-apt-repository "deb https://cloud.r-project.org/bin/linux/ubuntu $(lsb_release -cs)-cran40/"
                sudo apt-get install -y r-base
            else
                echo "R is already installed."
            fi
            
            # Install common system dependencies for R packages on the VM
            # You may need to add more here depending on your R packages
            sudo apt-get install -y \
                libcurl4-openssl-dev \
                libssl-dev \
                libxml2-dev
            
            # --- Deployment Script ---
            # Pull the latest changes from the repository
            git pull origin main
            
            # Restore dependencies using renv
            # This ensures the R packages on the VM match the lockfile
            R -e "renv::restore()"
            
            # Restart the Plumber service
            # This assumes you have a service manager like systemd set up.
            # You might need to adjust this command based on your setup.
            echo "Restarting Plumber service..."
            # Example for systemd: sudo systemctl restart plumber-api
            # Add your service restart command here
