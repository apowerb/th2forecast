name: Build Docker Image

# Images are published per release, not per commit.
#
# - pull request / push to main: both images are built and tested, nothing is
#   pushed.
# - release published (vX.Y.Z): both images are rebuilt from the tag, tested,
#   then pushed as X.Y.Z, X.Y and latest. A pre-release (vX.Y.Z-rc.1, or the
#   GitHub "pre-release" flag) only gets its exact version: X.Y and latest
#   move with stable releases only. Rules and tests: .github/scripts/.
# - workflow_dispatch: republishes an existing release from its tag.
#
# The commit-SHA tags pushed before this change stay on Docker Hub and remain
# pullable; nothing deletes them.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      version:
        description: "Release to republish, without the leading v (its vX.Y.Z tag is built)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tags:
    name: Resolve the image tags
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Test the tag rules
        run: bash .github/scripts/test-image-tags.sh

      # Empty outputs on pull requests and pushes to main: the build jobs then
      # build and test without pushing. Values go through env, not ${{ }} in
      # the script body, so a crafted tag or input cannot inject commands.
      - name: Resolve the release and its tags
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT_NAME" in
            release)
              tag="$RELEASE_TAG"
              prerelease="$RELEASE_PRERELEASE"
              ;;
            workflow_dispatch)
              tag="v${INPUT_VERSION#v}"
              # Republish only what was released, with its pre-release flag.
              prerelease="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
              ;;
            *)
              echo "Not a release: build and test only."
              exit 0
              ;;
          esac
          tags="$(bash .github/scripts/image-tags.sh "$tag" "$prerelease" | tr '\n' ' ')"
          # A fix on an older line (v0.1.5 after v0.2.0) or a republished old
          # version must not move `latest` back: keep it only for the release
          # GitHub marks as latest, the one apowerb-hosting's bump reads.
          # Only queried for a stable release: with pre-releases only, the
          # endpoint answers 404.
          if [[ " $tags " == *" latest "* ]]; then
            current_latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
            if [ "$current_latest" != "$tag" ]; then
              echo "$tag is not the latest release ($current_latest): latest is left alone."
              tags="${tags/latest/}"
            fi
          fi
          echo "Image tags for $tag: $tags"
          echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

  build:
    needs: tags
    runs-on: ubuntu-latest
    steps:
      # On a release, the tag itself; a dispatch would otherwise build main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tags.outputs.ref || github.ref }}

      - name: Build Docker Image
        run: docker build -t th2forecast:ci .

      - name: Run unit tests (testthat) in the built image
        run: docker run --rm th2forecast:ci Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Start container for smoke test
        run: |
          docker run -d --name th2forecast-ci -p 127.0.0.1:18000:8000 \
            -e TH2FORECAST_API_TOKEN=ci-smoke-token \
            th2forecast:ci

      - name: Wait for the API to be ready
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18000/health && exit 0
            sleep 2
          done
          echo "API not ready after 120 s"; exit 1

      - name: Run end-to-end smoke test
        env:
          TH2FORECAST_BASE_URL: http://127.0.0.1:18000
          TH2FORECAST_API_TOKEN: ci-smoke-token
        run: bash tests/e2e/smoke.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker logs th2forecast-ci || true

      - name: Stop smoke test container
        if: always()
        run: docker rm -f th2forecast-ci || true

      - name: Log in to Docker Hub
        if: needs.tags.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the release tags
        if: needs.tags.outputs.tags != ''
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag th2forecast:ci apowerb/th2forecast:"$tag"
            docker push apowerb/th2forecast:"$tag"
          done

  # The Python engine is the image apowerb-hosting deploys (compose and Helm),
  # so it is published for amd64 and arm64. Each architecture is built and
  # tested on a native runner; on a release each one pushes an untagged image
  # by digest, and `publish-python` tags the manifest list once both exist, so
  # a half-failed release never moves a tag to a single-architecture image.
  # The R image stays amd64-only: its R packages are compiled from source.
  build-python:
    name: build-python (${{ matrix.arch }})
    needs: tags
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tags.outputs.ref || github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python engine image (Chronos-2 + statsforecast)
        uses: docker/build-push-action@v6
        with:
          context: python
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: th2forecast-py:ci

      - name: Run unit tests (pytest) in the built image
        run: docker run --rm th2forecast-py:ci python -m pytest -q -p no:cacheprovider

      - name: Start container for smoke test
        run: |
          docker run -d --name th2forecast-py-ci -p 127.0.0.1:18001:8000 \
            -e TH2FORECAST_API_TOKEN=ci-smoke-token \
            th2forecast-py:ci

      - name: Wait for the API to be ready
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:18001/health && exit 0
            sleep 2
          done
          echo "API not ready after 120 s"; exit 1

      - name: Run end-to-end smoke test (same contract as the R API)
        env:
          TH2FORECAST_BASE_URL: http://127.0.0.1:18001
          TH2FORECAST_API_TOKEN: ci-smoke-token
        run: bash tests/e2e/smoke.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker logs th2forecast-py-ci || true

      - name: Stop smoke test container
        if: always()
        run: docker rm -f th2forecast-py-ci || true

      - name: Log in to Docker Hub
        if: needs.tags.outputs.tags != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Same builder and cache as the tested image: this step rebuilds nothing.
      - name: Push the tested image by digest
        id: push
        if: needs.tags.outputs.tags != ''
        uses: docker/build-push-action@v6
        with:
          context: python
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=apowerb/th2forecast-py,push-by-digest=true,name-canonical=true,push=true

      - name: Export the digest
        if: needs.tags.outputs.tags != ''
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: needs.tags.outputs.tags != ''
        uses: actions/upload-artifact@v4
        with:
          name: python-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-python:
    name: Publish the Python engine image
    needs: [tags, build-python]
    if: needs.tags.outputs.tags != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: python-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-architecture manifest with the release tags
        working-directory: /tmp/digests
        env:
          IMAGE: apowerb/th2forecast-py
          TAGS: ${{ needs.tags.outputs.tags }}
        run: |
          args=()
          for tag in $TAGS; do args+=(-t "$IMAGE:$tag"); done
          # shellcheck disable=SC2046  # one digest file per architecture
          docker buildx imagetools create "${args[@]}" $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect the published image
        env:
          IMAGE: apowerb/th2forecast-py
          TAGS: ${{ needs.tags.outputs.tags }}
        run: docker buildx imagetools inspect "$IMAGE:${TAGS%% *}"

  # Once the Python engine image is actually published (manifest created), tell
  # the private commercial repo thaink2/apowerb to deploy it to the OVH VMs.
  # This runs ONLY from a real release and ONLY from this repo (forks that copy
  # the workflow are excluded, and the secret is never exposed to fork PRs). It
  # is fail-soft: a missing/expired token must not turn the public OSS release
  # red -- the deploy can still be launched manually from thaink2/apowerb.
  #
  # The token DEPLOY_DISPATCH_TOKEN is a fine-grained PAT, resource owner
  # thaink2, scoped to thaink2/apowerb only, with Actions: Read and write (+
  # Metadata: Read). The private workflow reacts to the repository_dispatch
  # type `th2forecast-released` and deploys stable -> dev then prod, pre-release
  # -> dev only.
  notify-deploy:
    name: Trigger the private deploy (thaink2/apowerb)
    needs: [tags, publish-python]
    if: >-
      github.event_name == 'release'
      && github.repository == 'apowerb/th2forecast'
      && needs.tags.outputs.tags != ''
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Dispatch th2forecast-released
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAGS: ${{ needs.tags.outputs.tags }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DEPLOY_DISPATCH_TOKEN absent : dispatch ignore (deploiement a lancer manuellement depuis thaink2/apowerb)."
            exit 0
          fi
          # Premier tag resolu = la version (ex: "0.1.1 0.1 latest" -> 0.1.1,
          # ou "0.1.1-rc.1" seul pour une pre-release).
          VER="${TAGS%% *}"
          echo "Dispatch th2forecast-released version=$VER prerelease=$PRERELEASE"
          gh api repos/thaink2/apowerb/dispatches \
            -f event_type=th2forecast-released \
            -F "client_payload[version]=$VER" \
            -F "client_payload[prerelease]=$PRERELEASE"
