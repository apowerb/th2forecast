name: Build Docker Image

on:
  push:
    branches: [ main ]
    # Release : un tag vX.Y.Z publie les deux images en X.Y.Z et latest.
    # Les pushes sur main continuent de publier l'image par SHA (déploiement actuel).
    tags: [ 'v[0-9]+.[0-9]+.[0-9]+' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t apowerb/th2forecast:${{ github.sha }} .

      - name: Run unit tests (testthat) in the built image
        run: docker run --rm apowerb/th2forecast:${{ github.sha }} Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'

      - name: Start container for smoke test
        run: |
          docker run -d --name th2forecast-ci -p 127.0.0.1:18000:8000 \
            -e TH2FORECAST_API_TOKEN=ci-smoke-token \
            apowerb/th2forecast:${{ github.sha }}

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18000/health && exit 0
            sleep 2
          done
          echo "API not ready after 120 s"; exit 1

      - name: Run end-to-end smoke test
        env:
          TH2FORECAST_BASE_URL: http://127.0.0.1:18000
          TH2FORECAST_API_TOKEN: ci-smoke-token
        run: bash tests/e2e/smoke.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker logs th2forecast-ci || true

      - name: Stop smoke test container
        if: always()
        run: docker rm -f th2forecast-ci || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            for tag in "$version" latest; do
              docker tag apowerb/th2forecast:${{ github.sha }} apowerb/th2forecast:"$tag"
              docker push apowerb/th2forecast:"$tag"
            done
          else
            docker push apowerb/th2forecast:${{ github.sha }}
          fi

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Python engine image (Chronos-2 + statsforecast)
        run: docker build -t apowerb/th2forecast-py:${{ github.sha }} python

      - name: Run unit tests (pytest) in the built image
        run: docker run --rm apowerb/th2forecast-py:${{ github.sha }} python -m pytest -q -p no:cacheprovider

      - name: Start container for smoke test
        run: |
          docker run -d --name th2forecast-py-ci -p 127.0.0.1:18001:8000 \
            -e TH2FORECAST_API_TOKEN=ci-smoke-token \
            apowerb/th2forecast-py:${{ github.sha }}

      - name: Wait for the API to be ready
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18001/health && exit 0
            sleep 2
          done
          echo "API not ready after 120 s"; exit 1

      - name: Run end-to-end smoke test (same contract as the R API)
        env:
          TH2FORECAST_BASE_URL: http://127.0.0.1:18001
          TH2FORECAST_API_TOKEN: ci-smoke-token
        run: bash tests/e2e/smoke.sh

      - name: Container logs (on failure)
        if: failure()
        run: docker logs th2forecast-py-ci || true

      - name: Stop smoke test container
        if: always()
        run: docker rm -f th2forecast-py-ci || true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            for tag in "$version" latest; do
              docker tag apowerb/th2forecast-py:${{ github.sha }} apowerb/th2forecast-py:"$tag"
              docker push apowerb/th2forecast-py:"$tag"
            done
          else
            docker push apowerb/th2forecast-py:${{ github.sha }}
          fi
